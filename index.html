<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });
        } catch (err) {}

        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>Chunks Reading - Teacher-Controlled Classroom</title>
    <meta name="description" content="Neobrutalist classroom teaching assistant for chunk-based English reading with synchronized teacher-controlled playback, phrase highlights, and real-time learner participation." />

    <meta property="og:description" content="Neobrutalist classroom teaching assistant for chunk-based English reading with synchronized teacher-controlled playback, phrase highlights, and real-time learner participation." />

  </head>

</html>
